services:
  minio:
    image: minio/minio:latest
    container_name: log-archiver-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: log-archiver-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
      MINIO_BUCKET: ${MINIO_BUCKET:-traffic-log-archive}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
        sleep 2;
      done;
      mc mb --ignore-existing "local/$${MINIO_BUCKET}";
    restart: "no"

  log-archiver:
    build:
      context: .
    container_name: log-archiver
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      # This is the path inside the container, not the host path.
      ARCHIVE_SOURCE_DIR: /archive-logs
      ARCHIVER_POLL_INTERVAL_SECONDS: ${ARCHIVER_POLL_INTERVAL_SECONDS:-30}
      ARCHIVER_MIN_AGE_SECONDS: ${ARCHIVER_MIN_AGE_SECONDS:-60}
      ARCHIVER_LOG_LEVEL: ${ARCHIVER_LOG_LEVEL:-INFO}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_BUCKET: ${MINIO_BUCKET:-traffic-log-archive}
      STORAGE_OBJECT_PREFIX: ${MINIO_OBJECT_PREFIX:-apisix/access-logs}
      STORAGE_ADDRESSING_STYLE: path
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
      STORAGE_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      # Standalone demo input. The full platform Compose file mounts the
      # shared apisix_logs volume instead.
      - ./local-storage:/archive-logs:ro

volumes:
  minio_data:
